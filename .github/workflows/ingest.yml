name: Ingest

# The single pipeline action. Replaces the separate ingest, models,
# benchmarks and stocks workflows — everything that used to run on its own
# schedule now runs here, in order.
#
# Every 4 hours on weekdays. Feed config, dedupe state and run history live in
# Postgres, so the article stages commit nothing. The market-data stages are
# the one exception: the front end reads _data/*.json and *.yml from the repo,
# so those four files are committed back to main at the end of the run.
#
# A manual dispatch with `source_id` set restricts the whole article pipeline
# to that one ingest_sources row (bypassing its active/active_months gate,
# since asking for it by id is itself the override) and skips build_stories
# and the market-data stages entirely — neither is about any one source, so
# there's nothing there worth the run time. See the per-source "run" button
# in Admin / Sources.

on:
  schedule:
    # 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC, Monday–Friday
    - cron: "0 */4 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (fetch only, no LLM calls or writes)"
        type: boolean
        default: false
      trigger:
        description: "Who started this run (set to 'admin' by the admin page)"
        type: string
        default: manual
      source_id:
        description: "Only ingest this one ingest_sources.id (blank = every active source, the normal sweep)"
        type: string
        default: ""

permissions:
  # the market-data step pushes _data/*.json back to main
  contents: write
  issues: write

concurrency:
  # A 4-hourly run plus an admin-triggered one could otherwise overlap and
  # double-summarise the same articles.
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Only needed when the `summarizer_model` Admin setting picks a
      # gemini-* or claude-* model (scripts/llm.py dispatches on that
      # prefix). Empty if the secret was never added — fine, since it's
      # then simply unused.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # scripts/ import each other directly, and the stage scripts attach
      # their counters to the run opened by the first step.
      PYTHONPATH: scripts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.OPENAI_API_KEY }}"
          echo "::add-mask::${{ secrets.GEMINI_API_KEY }}"
          echo "::add-mask::${{ secrets.ANTHROPIC_API_KEY }}"
          echo "::add-mask::${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          echo "::add-mask::${{ secrets.FINNHUB_API_KEY }}"

      - name: Open run record
        if: ${{ !inputs.dry_run }}
        id: run
        run: |
          python -c "
          from ingest_store import start_run
          import os
          rid = start_run(os.environ.get('TRIGGER', 'schedule'))
          print(f'run_id={rid or \"\"}')
          " >> "$GITHUB_OUTPUT"
        env:
          TRIGGER: ${{ inputs.trigger || 'schedule' }}

      # ── Articles ────────────────────────────────────────────────

      # For sources whose official RSS/Atom feed is dead (see
      # feeds/scrape_targets.yml), synthesizes a feed by scraping the blog's
      # listing page. Must run before "Fetch feeds", which reads its output
      # for any source configured with type='scrape'. Never blocks the real
      # ingest behind it.
      - name: Generate scraped feeds
        run: >
          python scripts/generate_scraped_feeds.py
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ inputs.source_id && format('--source-id {0}', inputs.source_id) || '' }}
        continue-on-error: true

      - name: Fetch feeds
        run: >
          python scripts/fetch_feeds.py
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ inputs.source_id && format('--source-id {0}', inputs.source_id) || '' }}

      - name: Deduplicate
        if: ${{ !inputs.dry_run }}
        run: python scripts/deduplicate.py
        env:
          INGEST_RUN_ID: ${{ steps.run.outputs.run_id }}

      - name: Classify articles
        if: ${{ !inputs.dry_run }}
        run: python scripts/classify_article.py

      - name: Tag companies
        if: ${{ !inputs.dry_run }}
        run: python scripts/tag_company.py

      - name: Summarize news
        if: ${{ !inputs.dry_run }}
        run: python scripts/summarize_news.py
        env:
          INGEST_RUN_ID: ${{ steps.run.outputs.run_id }}
          SUMMARIZER_MODEL: ${{ vars.SUMMARIZER_MODEL || 'gpt-4o-mini' }}

      - name: Summarize research
        if: ${{ !inputs.dry_run }}
        run: python scripts/summarize_research.py
        env:
          INGEST_RUN_ID: ${{ steps.run.outputs.run_id }}
          SUMMARIZER_MODEL: ${{ vars.SUMMARIZER_MODEL || 'gpt-4o-mini' }}

      - name: Sync company records
        if: ${{ !inputs.dry_run }}
        run: python scripts/generate_company_pages.py

      # Cross-source clustering — irrelevant to verifying one source, and it
      # spends its own LLM budget doing it, so a single-source run skips it.
      - name: Build stories
        if: ${{ !inputs.dry_run && !inputs.source_id }}
        run: python scripts/build_stories.py
        env:
          INGEST_RUN_ID: ${{ steps.run.outputs.run_id }}
          SUMMARIZER_MODEL: ${{ vars.SUMMARIZER_MODEL || 'gpt-4o-mini' }}
        continue-on-error: true

      # ── Market data and reference tables ────────────────────────
      # Folded in from the retired stocks / models / benchmarks workflows.
      # These write _data/*.json and *.yml, which are committed below because
      # the front end still reads them from the repo. Unrelated to any one
      # article source, so a single-source run skips these too.

      - name: Fetch stocks
        if: ${{ !inputs.dry_run && !inputs.source_id }}
        run: python scripts/fetch_stocks.py
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        continue-on-error: true

      - name: Compute AI index
        if: ${{ !inputs.dry_run && !inputs.source_id }}
        run: python scripts/compute_ai_index.py
        continue-on-error: true

      - name: Refresh benchmarks
        if: ${{ !inputs.dry_run && !inputs.source_id }}
        run: python scripts/fetch_benchmarks.py
        continue-on-error: true

      - name: Check model pricing
        if: ${{ !inputs.dry_run && !inputs.source_id }}
        run: python scripts/fetch_models.py
        continue-on-error: true

      # ── Persist the data files the site still reads from git ────

      - name: Commit market data
        if: ${{ !inputs.dry_run && !inputs.source_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/stocks_snapshot.json _data/ai_index_history.json \
                  _data/benchmarks.yml _data/models.yml || true
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "chore(ingest): refresh market data [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin main && break
            echo "push attempt $attempt failed, retrying..."
            sleep $((attempt * 3))
          done

      - name: Close run record
        if: ${{ always() && !inputs.dry_run && steps.run.outputs.run_id != '' }}
        run: |
          python -c "
          from ingest_store import finish_run
          import os
          finish_run(int(os.environ['RUN_ID']), os.environ['STATUS'], {}, os.environ.get('ERR') or None)
          "
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
          STATUS: ${{ job.status == 'success' && 'success' || 'failed' }}
          ERR: ${{ job.status != 'success' && format('Job finished with status {0}', job.status) || '' }}

    outputs:
      job_status: ${{ job.status }}

  notify-on-failure:
    needs: ingest
    if: failure()
    uses: ./.github/workflows/issue-on-failure.yml
    with:
      workflow_name: "Ingest"
      run_id: ${{ github.run_id }}
    secrets: inherit
