name: migrate articles to Supabase (manual)

# One-off backfill of the Jekyll archive into Supabase, runnable entirely from
# the GitHub web UI — no local Python or shell needed.
#
# Before the first run:
#   1. Apply the schema in the Supabase SQL Editor, in order:
#        supabase/migrations/0001_create_content_schema.sql
#        supabase/migrations/0002_content_views.sql
#   2. Add two repository secrets (Settings → Secrets and variables → Actions):
#        SUPABASE_URL                https://<project-ref>.supabase.co
#        SUPABASE_SERVICE_ROLE_KEY   service-role key (Supabase → Settings → API)
#
# Then run this workflow from the Actions tab. It defaults to a dry run;
# uncheck "dry_run" to actually write. The load is idempotent — articles
# upsert on (category, slug) — so re-running is safe.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (validate and report counts, write nothing)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Mask secrets
        run: echo "::add-mask::${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"

      - name: Check credentials are configured
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repository secrets first."
            exit 1
          fi
          echo "credentials present for ${SUPABASE_URL}"

      - name: Check the source files are present on this branch
        run: |
          posts=$(find _posts -name '*.md' 2>/dev/null | wc -l)
          echo "_posts/**.md: $posts"
          if [ "$posts" -eq 0 ]; then
            echo "::error::No .md posts found. Run this on the branch that still contains _posts/ (they are deleted once the backfill is verified)."
            exit 1
          fi

      - name: Build the migration bundle
        run: python scripts/migrate_extract.py

      - name: Upload bundle for inspection
        uses: actions/upload-artifact@v4
        with:
          name: migration-bundle
          path: _data/migration_bundle.json
          retention-days: 7

      - name: Load into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/migrate_load.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### Supabase backfill"
            echo ""
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "**Dry run** — nothing was written. Re-run with \`dry_run\` unchecked to load."
            else
              echo "Rows loaded. Check the step log above for the verification counts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
