# Tracked AI models for /models/, the model pages, comparisons and the
# price index.
#
# This file only decides *which* models are tracked and how they are named
# and linked. Prices, context windows and capabilities are never typed in
# by hand: scripts/fetch_model_prices.py reads them daily from LiteLLM's
# public model price list (MIT licence,
# https://github.com/BerriAI/litellm/blob/main/model_prices_and_context_window.json),
# which records each provider's first-party API list price, and stores a
# new history row whenever a price changes.
#
# Fields
#   slug      URL segment: /models/<slug>/
#   name      display name
#   provider  who sells the API (shown on the page)
#   company   canonical company name, linking to /companies/<slug>/
#   key       the model's key in LiteLLM's price list (first-party API)
#
# Add a model: append an entry (key must exist in the price list), merge,
# and the next ingest run fills in its data. Retiring a model: set
# `retired: true` to keep its page and history but drop it from listings.

models:
