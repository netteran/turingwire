<div class="err-page">

  <!-- Glitch 404 -->
  <div class="glitch-wrap">
    <span class="glitch" aria-label="404">404</span>
  </div>

  <p class="tw-muted" style="margin-top:0.75rem; font-size:1rem; max-width:30rem;">
    This page wasn't in the training data — or it never existed.
  </p>

  <!-- Terminal simulation -->
  <div class="terminal" role="region" aria-label="Model debug output">
    <div class="terminal-bar">
      <span class="dot dot-r"></span>
      <span class="dot dot-y"></span>
      <span class="dot dot-g"></span>
      <span class="terminal-title">tw-retrieval-agent — bash</span>
    </div>
    <div class="terminal-body" id="terminal-output">
      <div><span class="t-dim">$</span> <span class="t-acc">tw-agent</span> fetch --url "<span id="page-url" class="t-warn"></span>"</div>
      <div id="tl-1" class="type-line t-dim" style="--chars:42;--dur:0.9s"></div>
      <div id="tl-2" class="type-line t-dim" style="--chars:38;--dur:0.7s"></div>
      <div id="tl-3" class="type-line t-err" style="--chars:44;--dur:0.8s"></div>
      <div id="tl-4" class="type-line" style="--chars:48;--dur:0.85s; margin-top:0.25rem;"></div>
      <div id="tl-5" class="type-line t-dim" style="--chars:36;--dur:0.65s"></div>
      <div style="margin-top:0.25rem;"><span class="t-dim">$</span> <span class="cursor"></span></div>
    </div>
  </div>
